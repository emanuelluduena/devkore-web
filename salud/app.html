/* ================= Agenda ================= */
function vAgenda(){
  const profs=soloPropia()?S.profs.filter(p=>p.id===me.profId):S.profs.filter(p=>p.activo);
  const ts=S.turnos.filter(t=>t.fecha===ui.fecha&&t.estado!=='cancelado');
  const H0=8*60,H1=20*60,STEP=30,skip={};let rows='';
  for(let m=H0;m<H1;m+=STEP){
    rows+=`<tr><th class="hora">${hm(m)}</th>`;
    for(const p of profs){
      if(skip[p.id+'_'+m])continue;
      const t=ts.find(t=>t.profId===p.id&&t.desde>=m&&t.desde<m+STEP);
      if(t){
        const span=Math.max(1,Math.ceil(t.dur/STEP));
        for(let i=1;i<span;i++)skip[p.id+'_'+(m+i*STEP)]=1;
        rows+=`<td rowspan="${span}"><div class="tcard" style="--c:${p.color}" onclick="verTurno('${t.id}')"><b>${esc(pacNom(t.pacId))}</b>${hm(t.desde)}–${hm(t.desde+t.dur)} <span class="badge ${t.estado}">${t.estado}</span></div></td>`;
      }else rows+=can('turnos_editar')?`<td class="libre" onclick="nuevoTurno('${p.id}',${m})"></td>`:'<td></td>';
    }
    rows+='</tr>';
  }
  const tot=ts.length;
  return `<div class="bar"><h2>Agenda · ${diaLargo(ui.fecha)}</h2>
   <button class="btn o" onclick="cambiarFecha(-1)">◀</button>
   <input type="date" value="${ui.fecha}" onchange="ui.fecha=this.value;render()">
   <button class="btn o" onclick="cambiarFecha(1)">▶</button>
   <button class="btn o" onclick="ui.fecha=ymd(new Date());render()">Hoy</button>
   ${can('turnos_editar')?'<button class="btn g" onclick="nuevoTurno()">+ Nuevo turno</button>':''}</div>
   <div class="mut" style="margin-bottom:10px">${tot} turno${tot===1?'':'s'} este día · clic en un horario libre para agendar · clic en un turno para ver, reprogramar o cambiar su estado</div>
   <div class="agenda"><table><tr><th class="hora ph" style="position:sticky;top:0"></th>${profs.map(p=>`<th class="ph">${esc(p.nombre+' '+p.apellido)}<small>${esc(p.esp)}</small></th>`).join('')}</tr>${rows}</table></div>`;
}

}
const pacLabel=p=>`${p.apellido}, ${p.nombre}${p.dni?' · '+p.dni:''}`;
function guardarTurno(){
  const p=S.pacientes.find(x=>pacLabel(x)===$('#t_pac').value.trim());
  if(!p){alert('Elegí un paciente de la lista. Si es nuevo, cargalo primero en Pacientes.');return}
  const profId=soloPropia()&&me.profId?me.profId:$('#t_prof').value;
  const fecha=$('#t_fecha').value,hora=$('#t_hora').value;
  if(!fecha||!hora){alert('Completá fecha y hora');return}
  const dur=+$('#t_dur').value,n=+$('#t_rep').value,serie=n>1?uid():'';
  const nuevos=[],conflictos=[];
  for(let i=0;i<n;i++){
    const t={id:uid(),pacId:p.id,profId,fecha:addDays(fecha,7*i),desde:toMin(hora),dur,estado:'pendiente',motivo:$('#t_mot').value.trim(),serie,hist:[]};
    const otro=S.turnos.find(x=>x.estado!=='cancelado'&&solapa(x,t)&&(x.profId===profId||x.pacId===p.id));
    if(otro)conflictos.push(`${fmtF(t.fecha)} (${otro.profId===profId?'el profesional ya tiene un turno':'el paciente ya tiene un turno'})`);
    nuevos.push(t);
  }
  if(conflictos.length){alert('No se pudo agendar por superposición:\n\n'+conflictos.join('\n'));return}
  S.turnos.push(...nuevos);log('crear_turno',`${pacNom(p.id)} con ${profNom(profId)} · ${fmtF(fecha)} ${hora}${n>1?' (x'+n+' semanas)':''}`);
  closeModal();render();
}

  <label>Estado</label><div style="display:flex;gap:6px;flex-wrap:wrap">${can('turnos_editar')?ESTADOS.map(e=>`<button class="btn s ${t.estado===e?'':'o'}" onclick="estadoTurno('${id}','${e}')">${e}</button>`).join(''):`<span class="badge ${t.estado}">${t.estado}</span>`}</div>

  ${can('pac_ver')?`<button class="btn o" onclick="closeModal();abrirFicha('${t.pacId}')">Abrir ficha</button>`:''}
  ${t.serie&&can('turnos_editar')?`<button class="btn r s" onclick="cancelarSerie('${id}')">Cancelar este y los siguientes</button>`:''}
  <button class="btn o" onclick="closeModal()">Cerrar</button></div>`);
}
function editarTurno(id){
  if(!can('turnos_editar')){alert('Tu usuario no puede modificar turnos.');return}
  const t=S.turnos.find(x=>x.id===id);if(!t)return;
  const ps=S.profs.filter(p=>p.activo||p.id===t.profId);
  openModal(`<h3>Reprogramar / editar turno</h3><div class="mut">${esc(pacNom(t.pacId))}</div>
  <div class="row2"><div><label>Profesional</label><select id="e_prof" ${soloPropia()&&me.profId?'disabled':''}>${ps.map(p=>`<option value="${p.id}" ${p.id===t.profId?'selected':''}>${esc(p.nombre+' '+p.apellido+' · '+p.esp)}</option>`).join('')}</select></div>
  <div><label>Fecha</label><input type="date" id="e_fecha" value="${t.fecha}"></div></div>
  <div class="row2"><div><label>Hora</label><input type="time" id="e_hora" step="900" value="${hm(t.desde)}"></div>
  <div><label>Duración</label><select id="e_dur">${durOpts(t.dur)}</select></div></div>
  <label>Motivo</label><input id="e_mot" value="${esc(t.motivo)}">
  ${t.serie?'<div class="mut" style="font-size:12px;margin-top:8px">Este turno es parte de una serie semanal: el cambio se aplica solo a este turno.</div>':''}
  <div class="acts"><button class="btn o" onclick="verTurno('${id}')">Volver</button><button class="btn g" onclick="guardarEdicionTurno('${id}')">Guardar cambios</button></div>`);
}
function guardarEdicionTurno(id){
  const t=S.turnos.find(x=>x.id===id);
  const fecha=$('#e_fecha').value,hora=$('#e_hora').value;
  if(!fecha||!hora){alert('Completá fecha y hora');return}
  const n={...t,profId:soloPropia()&&me.profId?t.profId:$('#e_prof').value,fecha,desde:toMin(hora),dur:+$('#e_dur').value,motivo:$('#e_mot').value.trim()};
  const otro=S.turnos.find(x=>x.id!==id&&x.estado!=='cancelado'&&solapa(x,n)&&(x.profId===n.profId||x.pacId===n.pacId));
  if(otro){alert(otro.profId===n.profId?'Ese horario se superpone con otro turno del profesional.':'El paciente ya tiene otro turno en ese horario.');return}
  const desc=x=>`${fmtF(x.fecha)} ${hm(x.desde)}–${hm(x.desde+x.dur)} · ${profNom(x.profId)}`;
  const cambio=desc(t)!==desc(n);
  if(cambio){t.hist=t.hist||[];t.hist.push({t:Date.now(),u:me.nombre,de:desc(t),a:desc(n)});log('reprogramar_turno',`${pacNom(t.pacId)}: ${desc(t)} → ${desc(n)}`)}
  else log('editar_turno',pacNom(t.pacId));
  Object.assign(t,{profId:n.profId,fecha:n.fecha,desde:n.desde,dur:n.dur,motivo:n.motivo});
  if(cambio&&(t.estado==='cancelado'||t.estado==='ausente'))t.estado='pendiente'; // vuelve a quedar activo
  save();closeModal();if(ui.view==='agenda')ui.fecha=n.fecha;render();
}
function estadoTurno(id,e){if(!can('turnos_editar'))return;const t=S.turnos.find(x=>x.id===id);t.estado=e;log('estado_turno',`${pacNom(t.pacId)} → ${e}`);closeModal();render()}
function cancelarSerie(id){
  if(!can('turnos_editar'))return;
  const t=S.turnos.find(x=>x.id===id);
  S.turnos.filter(x=>x.serie===t.serie&&x.fecha>=t.fecha).forEach(x=>x.estado='cancelado');
  log('cancelar_serie',pacNom(t.pacId));closeModal();render();
}

function guardarPaciente(id){
  const v=k=>$('#f_'+k).value.trim();
  if(!v('apellido')||!v('nombre')){alert('Apellido y nombre son obligatorios');return}
  const d=Object.fromEntries(PKEYS.map(k=>[k,v(k)]));d.cud=$('#f_cud').checked;
  if(id){Object.assign(pac(id),d);log('editar_paciente',pacNom(id))}
  else{d.id=uid();S.pacientes.push(d);log('crear_paciente',pacNom(d.id));ui.pid=d.id}
  save();closeModal();render();
}

}

  const adm=u.rol==='admin';
  return (adm?'<div class="note">El rol Administrador tiene todos los permisos y no se pueden quitar.</div>':'<div class="mut" style="font-size:12px;margin-bottom:4px">Al cambiar el rol se cargan los permisos por defecto de ese rol. Después podés ajustarlos.</div>')+
  PERMS.map(([g,items])=>`<h4 class="sec">${g}</h4>${items.map(([k,l])=>`<label style="display:flex;gap:8px;align-items:flex-start;font-weight:400;color:var(--txt);font-size:14px;margin:6px 0"><input type="checkbox" id="pm_${k}" style="width:auto;margin-top:3px" ${permDe(u,k)?'checked':''} ${adm?'disabled':''}> <span>${l}</span></label>`).join('')}`).join('');
}
function cambiarRolUsuario(){$('#u_perms').innerHTML=permsHtml({rol:$('#u_rol').value,perm:null})}
function editarUsuario(id){
  const u=id?S.users.find(x=>x.id===id):{usuario:'',nombre:'',pass:'',rol:'secretaria',profId:'',activo:true};
  const yo=!!id&&id===me.id;
  openModal(`<h3>${id?'Editar':'Nuevo'} usuario</h3>
  <div class="row2"><div><label>Nombre a mostrar</label><input id="u_nom" value="${esc(u.nombre)}"></div><div><label>Usuario (para ingresar)</label><input id="u_usr" value="${esc(u.usuario)}" autocomplete="off"></div>
  <div><label>Contraseña</label><input id="u_pass" value="${esc(u.pass||'')}" autocomplete="off"></div>
  <div><label>Rol</label><select id="u_rol" onchange="cambiarRolUsuario()" ${yo?'disabled':''}>${Object.entries(ROLES).map(([k,l])=>`<option value="${k}" ${u.rol===k?'selected':''}>${l}</option>`).join('')}</select></div>
  <div><label>Profesional vinculado</label><select id="u_prof"><option value="">— Ninguno —</option>${S.profs.map(p=>`<option value="${p.id}" ${u.profId===p.id?'selected':''}>${esc(p.nombre+' '+p.apellido+' · '+p.esp)}</option>`).join('')}</select></div></div>
  <div class="mut" style="font-size:12px;margin-top:6px">Si el usuario es profesional, vinculalo a su ficha: así ve su propia agenda y firma sus evoluciones.</div>
  <h4 class="sec" style="font-size:15px">Permisos</h4>
  <div id="u_perms">${permsHtml(u)}</div>
  <div class="acts"><button class="btn o" onclick="closeModal()">Cancelar</button><button class="btn g" onclick="guardarUsuario('${id||''}')">Guardar</button></div>`,true);
}
function guardarUsuario(id){
  if(!can('usuarios'))return;
  const nom=$('#u_nom').value.trim(),usr=$('#u_usr').value.trim().toLowerCase(),pass=$('#u_pass').value,profId=$('#u_prof').value;
  const rol=id&&id===me.id?me.rol:$('#u_rol').value;
  if(!nom||!usr||!pass){alert('Nombre, usuario y contraseña son obligatorios');return}
  if(S.users.some(x=>x.usuario===usr&&x.id!==id)){alert('Ya existe un usuario con ese nombre');return}
  if(rol==='profesional'&&!profId){alert('Un usuario con rol Profesional tiene que estar vinculado a un profesional.');return}
  const perm=rol==='admin'?null:Object.fromEntries(ALLP.map(k=>[k,$('#pm_'+k).checked]));
  if(id&&id===me.id&&perm&&!perm.usuarios){alert('No podés quitarte a vos mismo el permiso de gestionar usuarios.');return}
  if(id){Object.assign(S.users.find(x=>x.id===id),{nombre:nom,usuario:usr,pass,rol,profId,perm});log('editar_usuario',usr)}
  else{S.users.push({id:uid(),nombre:nom,usuario:usr,pass,rol,profId,perm,activo:true});log('crear_usuario',usr)}
  save();closeModal();render();
}
function toggleUsuario(id){
  const u=S.users.find(x=>x.id===id);if(!u||u.id===me.id)return;
  u.activo=u.activo===false;log('toggle_usuario',u.usuario);render();
}

render();
</script>
</body>
</html>
